name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configure runtime paths
        run: |
          echo "IOT_STATE_DIR=$RUNNER_TEMP/iot-state" >> "$GITHUB_ENV"
          echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/python-cache" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev ruff check .
      - run: uv run --frozen --extra dev ruff format --check .
      - run: uv run --frozen --extra dev pytest --cov=api --cov-report=term-missing
      - run: uv run --frozen --extra dev python admin_panel/manage.py test devices --verbosity 2
      - run: uv run --frozen --extra dev alembic upgrade head
      - run: uv run --frozen --extra dev alembic check

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: iot_test
          POSTGRES_USER: iot_test
          POSTGRES_PASSWORD: ci-only-ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iot_test -d iot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://iot_test:ci-only-ephemeral@127.0.0.1:5432/iot_test
      TEST_POSTGRES_URL: postgresql+psycopg://iot_test:ci-only-ephemeral@127.0.0.1:5432/iot_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configure runtime paths
        run: |
          echo "IOT_STATE_DIR=$RUNNER_TEMP/iot-state" >> "$GITHUB_ENV"
          echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/python-cache" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev alembic upgrade head
      - run: uv run --frozen --extra dev alembic check
      - run: uv run --frozen --extra dev pytest -ra
