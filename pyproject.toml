[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-micro-leasing"
version = "2.0.0"
requires-python = ">=3.14,<3.15"
description = "Transactional IoT usage billing with FastAPI and a Django operations dashboard"
dependencies = [
    "fastapi>=0.119,<1",
    "uvicorn[standard]>=0.38,<1",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "sqlmodel>=0.0.27,<0.1",
    "alembic>=1.17,<2",
    "slowapi>=0.1.9,<0.2",
    "redis>=6.4,<8",
    "structlog>=25.4,<27",
    "django>=5.2.8,<5.3",
    "django-unfold>=0.70,<1",
    "psycopg[binary]>=3.2.10,<4",
    "celery[redis]>=5.6,<6",
    "reportlab>=4.4,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "httpx>=0.28.1,<1",
    "ruff>=0.14,<1",
    "pip-audit>=2.9,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "admin_panel*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["api"]
branch = true

[tool.coverage.report]
show_missing = true
